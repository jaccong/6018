name: iptv-auto-update

# 触发条件：手动触发 + 单个 cron 定时（可根据需求修改时间）
on:
  workflow_dispatch:
  schedule:
    - cron: '56 1,3,7,9,11,13,21,23 * * *'  # 保留一个定时，按需调整
# 工作流级 concurrency 配置，放在 on 之后、jobs 之前
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}  # 并发组：工作流名+分支名，确保同分支不重复
  cancel-in-progress: true  # 新触发时取消正在运行的旧实例（可改为 false 让新实例排队）

# 授予工作流读写仓库权限（必须）
permissions:
  contents: write

jobs:
  iptv-update-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: 安装系统依赖（Chrome + ChromeDriver）
        run: |
              sudo apt-get update
              sudo apt-get install -y wget unzip curl jq
              wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

              # 获取 Chrome 版本
              CHROME_VERSION=$(google-chrome --version | grep -oP '(\d+\.){3}\d+')
              echo "Chrome 版本：$CHROME_VERSION"

              # 提取主版本号（最稳定方案，彻底避免 404 + jq 错误）
              CHROME_MAIN=$(echo $CHROME_VERSION | cut -d '.' -f 1)
              echo "Chrome 主版本：$CHROME_MAIN"

              # 直接获取该主版本的最新官方驱动
              CHROMEDRIVER_VERSION=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone.json \
                | jq -r ".milestones.\"$CHROME_MAIN\".version")

              echo "使用 ChromeDriver 版本：$CHROMEDRIVER_VERSION"

              # 下载安装
              wget -O chromedriver.zip https://storage.googleapis.com/chrome-for-testing-public/$CHROMEDRIVER_VERSION/linux64/chromedriver-linux64.zip
              unzip -o chromedriver.zip
              sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
              sudo chmod +x /usr/local/bin/chromedriver

              chromedriver --version
      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt requests

      - name: 运行 time.py 爬取脚本
        run: python ${{ github.workspace }}/time.py
        env:
          PYTHONUNBUFFERED: 1

      - name: 检查 time.txt 有效性
        id: check_time
        run: |
          if [ -f "time.txt" ] && [ -s "time.txt" ]; then
            echo "time_exists=true" >> $GITHUB_ENV
            echo "time_size=$(du -sh time.txt | awk '{print $1}')" >> $GITHUB_ENV
          else
            echo "time_exists=false" >> $GITHUB_ENV
          fi

      - name: 提交 time.txt 到远程仓库
        if: env.time_exists == 'true'
        run: |
          git config --local user.email "jaccong@163.com"
          git config --local user.name "jaccong"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git pull --rebase origin $BRANCH || true
          git add time.txt
          git commit -m "Auto update time.txt: $(date +'%Y-%m-%d %H:%M:%S')" || echo "time.txt 无更新，跳过提交"
          git push origin $BRANCH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 运行 108.py 脚本（依赖 time.txt）
        if: env.time_exists == 'true'
        run: python ${{ github.workspace }}/108.py
        env:
          PYTHONUNBUFFERED: 1

      - name: 检查 108.txt 有效性
        id: check_108
        run: |
          if [ -f "108.txt" ] && [ -s "108.txt" ]; then
            echo "txt108_exists=true" >> $GITHUB_ENV
            echo "txt108_size=$(du -sh 108.txt | awk '{print $1}')" >> $GITHUB_ENV
          else
            echo "txt108_exists=false" >> $GITHUB_ENV
          fi

      - name: 提交 108.txt 到远程仓库
        if: env.txt108_exists == 'true'
        run: |
          git config --local user.email "jaccong@163.com"
          git config --local user.name "jaccong"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git pull --rebase origin $BRANCH || true
          git add 108.txt
          git commit -m "Auto update 108.txt: $(date +'%Y-%m-%d %H:%M:%S')" || echo "108.txt 无更新，跳过提交"
          git push origin $BRANCH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出完整执行报告
        run: |
          echo "======================================"
          echo "          IPTV 自动更新报告"
          echo "======================================"
          echo "执行时间：$(date +'%Y-%m-%d %H:%M:%S')"
          echo "--------------------------------------"
          echo "time.txt 状态: ${{ env.time_exists == 'true' && '✅ 成功' || '❌ 失败' }}"
